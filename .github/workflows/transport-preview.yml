name: Transport browser diagnostics preview
on:
  push:
    branches: ['fix/transport-browser-diagnostics']
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish isolated preview
        run: npx wrangler@4.80.0 pages deploy frontend/ --project-name caucashub --branch transport-check --commit-message "transport-check" --commit-hash "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
