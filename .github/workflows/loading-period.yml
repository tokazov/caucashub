name: Loading period regression
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SECRET_KEY: test-secret-for-loading-period
      GEMINI_API_KEY: test
      BREVO_API_KEY: test
      TG_BOT_TOKEN: test:test
      NOTIFICATIONS_WORKER_ENABLED: "0"
      TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:55438/postgres
      PG_BIN: /usr/lib/postgresql/18/bin
      POSTGRES_BIN: /usr/lib/postgresql/18/bin
      CI_POSTGRES_CONTAINER: caucashub-ci-postgres-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require PostgreSQL 18 archive and restore clients
        shell: bash
        run: |
          if [ ! -x "$PG_BIN/pg_dump" ] || [ ! -x "$PG_BIN/pg_restore" ] || [ ! -x "$PG_BIN/psql" ]; then
            sudo apt-get update
            if ! apt-cache show postgresql-client-18 >/dev/null 2>&1; then
              # Official signed PGDG repository; never install a database server.
              # https://www.postgresql.org/download/linux/ubuntu/
              sudo apt-get install -y curl ca-certificates
              sudo install -d /usr/share/postgresql-common/pgdg
              sudo curl --fail --show-error --location --retry 3 --max-time 60 \
                https://www.postgresql.org/media/keys/ACCC4CF8.asc \
                -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
              . /etc/os-release
              printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' \
                "Suites: ${VERSION_CODENAME}-pgdg" 'Components: main' \
                'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
                | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
              sudo apt-get update
            fi
            sudo apt-get install -y postgresql-client-18
          fi
          for tool in pg_dump pg_restore psql; do
            test -x "$PG_BIN/$tool"
            "$PG_BIN/$tool" --version | grep -Eq 'PostgreSQL\) 18([. ]|$)'
          done
      - name: Start and mark only disposable loopback PostgreSQL for the restore drill
        timeout-minutes: 2
        env:
          PGHOST: 127.0.0.1
          PGPORT: '55438'
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          # On this Linux runner host networking avoids Docker port-forward NAT.
          # The restore guard must see literal loopback on BOTH sides of TCP.
          # No host volume is mounted; this is synthetic data on an owned container.
          docker run --detach --network host --name "$CI_POSTGRES_CONTAINER" \
            --env POSTGRES_DB=postgres --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 \
            postgres:18 -c listen_addresses=127.0.0.1 -c port=55438
          ready=0
          for attempt in $(seq 1 30); do
            if "$PG_BIN/psql" -X --no-password --set ON_ERROR_STOP=1 --tuples-only --no-align \
              --command "SELECT host(inet_server_addr()) || '|' || current_database();" \
              | grep -Fxq '127.0.0.1|postgres'; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            docker logs "$CI_POSTGRES_CONTAINER"
            exit 1
          fi
          "$PG_BIN/psql" -X --no-password --set ON_ERROR_STOP=1 \
            --command "COMMENT ON DATABASE postgres IS 'caucashub-disposable-restore-admin-v1';"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio aiosqlite pypdf
      - name: Verify real custom archive and isolated restore
        run: python -m pytest tests/test_database_backup.py -v
      - name: Install frontend test dependencies
        run: npm install --prefix tests/frontend --no-package-lock --ignore-scripts
      - name: Backend and PostgreSQL migration regressions
        run: python -m pytest tests/test_listing_freshness.py tests/test_loading_period.py tests/test_release_schema.py tests/test_publication_journeys.py tests/test_carrier_profile.py tests/test_deal_completion_http.py tests/test_deal_act_pdf_layout.py tests/test_deal_review_schema.py tests/test_deal_completion_concurrency.py tests/test_notification_events.py tests/test_notification_inbox.py tests/test_notification_delivery.py tests/test_notification_schema.py tests/test_password_access.py tests/test_password_recovery_schema.py tests/test_admin_credentials_http.py tests/test_access_ownership.py tests/test_mari_dispatcher.py tests/test_mari_role.py tests/test_pilot_city_scope.py tests/test_pilot_listing_quality.py tests/test_route_locations.py tests/test_location_presentation.py tests/test_location_country.py tests/test_route_locations_postgres.py tests/test_release_order.py tests/test_ci_publish_gate.py tests/test_startup_schema_safety.py -q
      - name: JavaScript syntax
        run: |
          node --check api.js
          node --check frontend/api.js
          node --check main.js
          node --check frontend/main.js
          node --check frontend/locations.js
          node --check frontend/location-presentation.js
      - name: Frontend regression (UTC)
        run: node --test tests/frontend/tests/*.test.js
        env:
          TZ: UTC
      - name: Loading dates in another browser timezone
        run: node --test tests/frontend/tests/loading_dates.test.js
        env:
          TZ: Pacific/Kiritimati
      - name: Remove only the owned disposable PostgreSQL container
        if: always()
        run: |
          if docker container inspect "$CI_POSTGRES_CONTAINER" >/dev/null 2>&1; then
            docker rm --force --volumes "$CI_POSTGRES_CONTAINER"
          fi
  carrier-profile-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser dependencies
        run: |
          python -m pip install -r requirements.txt aiosqlite
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Verify real profile UI on disposable SQLite
        run: |
          mkdir -p artifacts/carrier-profile
          python tests/browser/carrier_profile_server.py > artifacts/carrier-profile/server.log 2>&1 &
          carrier_server_pid=$!
          trap 'kill "$carrier_server_pid" 2>/dev/null || true' EXIT
          node tests/browser/carrier_profile.cjs
      - name: Upload browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrier-profile-browser
          path: artifacts/carrier-profile/
          if-no-files-found: warn

  publication-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser dependencies
        run: |
          python -m pip install -r requirements.txt aiosqlite
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Verify publication, response and counterpart contacts
        run: |
          mkdir -p artifacts/publication-journey
          CARRIER_BROWSER_PUBLICATION=1 python tests/browser/carrier_profile_server.py > artifacts/publication-journey/server.log 2>&1 &
          carrier_server_pid=$!
          trap 'kill "$carrier_server_pid" 2>/dev/null || true' EXIT
          node tests/browser/publication_journey.cjs
      - name: Upload browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-browser
          path: artifacts/publication-journey/
          if-no-files-found: warn

  deal-completion-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser dependencies
        run: |
          python -m pip install -r requirements.txt aiosqlite pypdf
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Verify both confirmations, downloaded acts and persisted reviews
        run: |
          mkdir -p artifacts/deal-completion
          CARRIER_BROWSER_PUBLICATION=1 python tests/browser/carrier_profile_server.py > artifacts/deal-completion/server.log 2>&1 &
          carrier_server_pid=$!
          trap 'kill "$carrier_server_pid" 2>/dev/null || true' EXIT
          CARRIER_BROWSER_COMPLETION=1 CARRIER_PUBLICATION_ARTIFACTS=artifacts/deal-completion node tests/browser/publication_journey.cjs
          python tests/browser/verify_completion_pdfs.py artifacts/deal-completion
      - name: Upload browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deal-completion-browser
          path: artifacts/deal-completion/
          if-no-files-found: warn

  notification-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CARRIER_BROWSER_NOTIFICATIONS: "1"
      CARRIER_BROWSER_PUBLICATION: "1"
      CARRIER_BROWSER_COMPLETION: "1"
      NOTIFICATIONS_WORKER_ENABLED: "0"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser dependencies
        run: |
          python -m pip install -r requirements.txt aiosqlite pypdf
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Verify notification recipients, delivery sinks and persistent inbox
        run: |
          mkdir -p artifacts/notifications
          CARRIER_BROWSER_PUBLICATION=1 python tests/browser/carrier_profile_server.py > artifacts/notifications/server.log 2>&1 &
          carrier_server_pid=$!
          trap 'kill "$carrier_server_pid" 2>/dev/null || true' EXIT
          CARRIER_BROWSER_COMPLETION=1 CARRIER_PUBLICATION_ARTIFACTS=artifacts/notifications node tests/browser/publication_journey.cjs
          python tests/browser/verify_completion_pdfs.py artifacts/notifications
      - name: Upload browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-browser
          path: artifacts/notifications/
          if-no-files-found: warn

  auth-recovery-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CARRIER_BROWSER_AUTH: "1"
      CARRIER_BROWSER_PUBLICATION: "1"
      NOTIFICATIONS_WORKER_ENABLED: "0"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser dependencies
        run: |
          python -m pip install -r requirements.txt aiosqlite
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Verify password recovery, session revocation and account isolation
        run: |
          mkdir -p artifacts/auth-recovery
          python tests/browser/carrier_profile_server.py > artifacts/auth-recovery/server.log 2>&1 &
          carrier_server_pid=$!
          trap 'kill "$carrier_server_pid" 2>/dev/null || true' EXIT
          node tests/browser/auth_recovery.cjs
      - name: Upload recovery screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-recovery-browser
          path: artifacts/auth-recovery/
          if-no-files-found: warn

  address-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser dependencies
        run: |
          python -m pip install -r requirements.txt aiosqlite
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Verify exact address and checkpoint UI on disposable SQLite
        run: node tests/browser/address_journey.cjs --spawn-server
      - name: Upload address screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: address-browser
          path: artifacts/address-journey/
          if-no-files-found: warn


  # One stable check, with no production dependency, for Railway Wait for CI.
  # Explicitly reject skipped/cancelled prerequisites as well as test failures.
  validation:
    if: ${{ always() }}
    needs:
      - regression
      - carrier-profile-browser
      - publication-browser
      - deal-completion-browser
      - notification-browser
      - auth-recovery-browser
      - address-browser
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every offline and browser regression
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ["JOB_RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              raise SystemExit("Regression did not pass: " + ", ".join(sorted(failed)))
          print("All seven offline/browser jobs passed; backend CI gate is clear.")
          PY
