name: Loading period regression
on:
  push:
    branches: [master]
    paths:
      - "app/routers/transport.py"
      - ".github/workflows/loading-period.yml"
  pull_request:
    paths:
      - "app/**"
      - "api.js"
      - "main.js"
      - "frontend/**"
      - "tests/**"
      - "scripts/**"
      - "alembic/**"
      - ".github/workflows/loading-period.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: caucashub_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: test-secret-for-loading-period
      GEMINI_API_KEY: test
      BREVO_API_KEY: test
      TG_BOT_TOKEN: test:test
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/caucashub_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio aiosqlite pypdf
      - name: Backend and PostgreSQL migration regressions
        run: python -m pytest tests/test_listing_freshness.py tests/test_loading_period.py tests/test_release_schema.py tests/test_publication_journeys.py tests/test_carrier_profile.py tests/test_deal_completion_http.py tests/test_deal_act_pdf_layout.py tests/test_deal_review_schema.py tests/test_deal_completion_concurrency.py -q
      - name: JavaScript syntax
        run: |
          node --check api.js
          node --check frontend/api.js
          node --check main.js
          node --check frontend/main.js
      - name: Frontend regression (UTC)
        run: node --test tests/frontend/tests/*.test.js
        env:
          TZ: UTC
      - name: Loading dates in another browser timezone
        run: node --test tests/frontend/tests/loading_dates.test.js
        env:
          TZ: Pacific/Kiritimati
  public-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Read-only carrier visibility check
        env:
          WAIT_FOR_RELEASE: ${{ github.event_name == 'push' && '1' || '0' }}
        run: |
          python - <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen
          base = "https://api-production-f3ea.up.railway.app"
          wait = os.environ.get("WAIT_FOR_RELEASE") == "1"
          deadline = time.monotonic() + (600 if wait else 30)
          def get(path):
              request = Request(base + path, headers={"Accept": "application/json"})
              with urlopen(request, timeout=15) as response:
                  return json.load(response)
          while True:
              try:
                  counters = get("/api/stats/counters")
                  directory = get("/api/transport/?limit=200")
                  available = get("/api/transport/?limit=200&available_only=true")
                  trucks = get("/api/trucks/?limit=200")
                  rows = directory.get("offers", [])
                  ready = bool(rows) and all("dates_expired" in row for row in rows)
                  if not wait or ready:
                      # Public aggregates only: never log carrier names or contacts.
                      summary = {
                          "total_users": counters.get("total_users"),
                          "companies": counters.get("companies"),
                          "transport_total": directory.get("total"),
                          "current_transport_total": available.get("total"),
                          "expired_dates_visible": sum(row.get("dates_expired") is True for row in rows),
                          "truck_total": trucks.get("total"),
                          "release_schema_seen": ready,
                      }
                      print(json.dumps(summary, sort_keys=True))
                      if wait:
                          assert directory["total"] >= available["total"]
                          assert directory["total"] > 0
                          assert counters["total_users"] > 0
                      break
              except Exception as error:
                  if not wait:
                      raise
                  if time.monotonic() >= deadline:
                      raise
                  print("Public API not ready:", type(error).__name__)
              if time.monotonic() >= deadline:
                  raise TimeoutError("Carrier directory release did not become visible")
              time.sleep(10)
          PY

  carrier-profile-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser dependencies
        run: |
          python -m pip install -r requirements.txt aiosqlite
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Verify real profile UI on disposable SQLite
        run: |
          mkdir -p artifacts/carrier-profile
          python tests/browser/carrier_profile_server.py > artifacts/carrier-profile/server.log 2>&1 &
          carrier_server_pid=$!
          trap 'kill "$carrier_server_pid" 2>/dev/null || true' EXIT
          node tests/browser/carrier_profile.cjs
      - name: Upload browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrier-profile-browser
          path: artifacts/carrier-profile/
          if-no-files-found: warn

  publication-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser dependencies
        run: |
          python -m pip install -r requirements.txt aiosqlite
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Verify publication, response and counterpart contacts
        run: |
          mkdir -p artifacts/publication-journey
          CARRIER_BROWSER_PUBLICATION=1 python tests/browser/carrier_profile_server.py > artifacts/publication-journey/server.log 2>&1 &
          carrier_server_pid=$!
          trap 'kill "$carrier_server_pid" 2>/dev/null || true' EXIT
          node tests/browser/publication_journey.cjs
      - name: Upload browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-browser
          path: artifacts/publication-journey/
          if-no-files-found: warn

  deal-completion-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser dependencies
        run: |
          python -m pip install -r requirements.txt aiosqlite pypdf
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Verify both confirmations, downloaded acts and persisted reviews
        run: |
          mkdir -p artifacts/deal-completion
          CARRIER_BROWSER_PUBLICATION=1 python tests/browser/carrier_profile_server.py > artifacts/deal-completion/server.log 2>&1 &
          carrier_server_pid=$!
          trap 'kill "$carrier_server_pid" 2>/dev/null || true' EXIT
          CARRIER_BROWSER_COMPLETION=1 CARRIER_PUBLICATION_ARTIFACTS=artifacts/deal-completion node tests/browser/publication_journey.cjs
          python tests/browser/verify_completion_pdfs.py artifacts/deal-completion
      - name: Upload browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deal-completion-browser
          path: artifacts/deal-completion/
          if-no-files-found: warn
